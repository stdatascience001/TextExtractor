<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocLens | AI Document Intelligence & OCR Knowledge Engine</title>
    
    <!-- Primary SEO Meta Tags -->
    <meta name="description" content="DocLens is an AI-powered document intelligence and text extraction platform. Instantly extract, search, and analyze text from PDFs and scanned documents with split-screen OCR verification." />
    <meta name="keywords" content="DocLens, document intelligence, PDF OCR, AI text extraction, document parsing, knowledge engine, split-screen PDF viewer, OCR text extractor" />
    <meta name="author" content="DocLens" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Mobile & PWA Optimization -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="application-name" content="DocLens" />
    <meta name="apple-mobile-web-app-title" content="DocLens" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon1.png" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DocLens" />
    <meta property="og:title" content="DocLens | AI Document Intelligence & OCR Knowledge Engine" />
    <meta property="og:description" content="Extract, search, and analyze text from complex documents and PDFs with real-time OCR and interactive split-screen verification." />
    <meta property="og:image" content="/favicon.png" />
    <meta property="og:image:alt" content="DocLens Platform Preview" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DocLens | AI Document Intelligence & OCR Knowledge Engine" />
    <meta name="twitter:description" content="Extract, search, and analyze text from complex documents and PDFs with real-time OCR and interactive split-screen verification." />
    <meta name="twitter:image" content="/favicon.png" />
    <meta name="twitter:image:alt" content="DocLens Platform Preview" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DocLens",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All",
        "description": "DocLens is an AI-powered document intelligence and text extraction platform with split-screen PDF viewing and real-time OCR processing.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "AI-Powered Document Parsing",
          "Split-Screen Document Verification",
          "Real-Time Text Search & Highlighting",
          "Multi-format Support (PDF, PNG, JPG, JPEG)",
          "Structured Knowledge Extraction"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
